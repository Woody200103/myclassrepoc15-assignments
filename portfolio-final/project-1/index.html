<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Digital Clock</title>
        <!--link to the outside stylesheet-->
        <link rel="stylesheet" href="style.css">
    </head>
    <!-- created a clock-->
    <body>
        <!--container for the top text portion of the clock-->
        <div id="box2">
            <h2><u><em>Man's Existance</u></h2>
        </div>
        <!--container for the clock and ending text-->
        <div id="box1">
            <!--container for the actual clock-->
            <div class="clock">
                <!--container for the hours portion o the clock-->
                <div>
                    <span id="hour">00</span>
                    <span class="text">Hours</span>
                </div>
                <!--container for the minutes portion of the clock-->
                <div>
                    <span id="minutes">00</span>
                    <span class="text">Minutes</span>
                </div>
                <!--container for the seconds prtion of the clock-->
                <div>
                    <span id="seconds">00</span>
                    <span class="text">Seconds</span>
                </div>
                <!--container for the am-pm portion of the clock-->
                <div>    
                    <span id="ampm">AM</span>
                </div>

        </div>
        <!--didnt use a container for the last of the text for the clock-->
            <h3><u>Of a Day</u></em></h3>
            <!--link for the JavaScript-->
            <script src="index.js"></script>
    </body>
</html>
