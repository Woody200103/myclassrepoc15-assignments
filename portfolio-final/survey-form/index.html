<!DOCTYPE html>
  <html lang="en">
    <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  
  <link rel="stylesheet" href="styles.css">
  <title>Survey Form</title>
</head>

<body>

<h1 id="title">Survey Form</h1>

    <p id="description">This is a survey to pass this test with.</p>
  <form id="survey-form">
    <form>
      <label id="name-label">
      Name: <input id="name" type="text" placeholder="Your Full Name" required/>
      </label>
    </form>
  
    <form id="survey-form">
      <label id="email-label">
      Email: <input id="email" type="email" placeholder="YourEmail@gmail.com" for="survey-form" required/>
    </label>
    </form>

    <form id="survey-form">
      <label id="number-label">
      Phone: <input id="number" type="number" min="1" max="9999999999" placeholder="(555)555-5555" required/>
      </label>
      </form>
    <form id="survey-form">
          <select id="dropdown" name="dropdown" title="Choose one">
            <option>Choose one</option>
            <option>First</option>
            <option>Second</option>
            <option>Third</option>
    </form>
    <form id="survey-form">
      <input type="radio" name="button" value="first" id="button1" placeholder="First"/>First
      <input type="radio" name="button" value="second" id="button2" placeholder="Second"/>Second
    </form>

     <legend>Choose all that apply:
      <form id="survey-form" name="set1">
        <input type="checkbox" value="first" title="checkbox1" placeholder="one"/>Checkbox1
        <input type="checkbox" value="second"title="checkbox2" placeholder="two"/>Checkbox2
        <input type="checkbox" value="third"title="checkbox3" placeholder="three"/>Checkbox3
        <input type="checkbox" value="fourth"title="checkbox4" placeholder="four"/>Checkbox4       
      </form>
      </legend>

        <legend>
        <form id="survey-form" label="info" title="info" placeholder="Additional Comments">
            <label for="info">Additional information:</label>
            <br>
            <input type="text" id="info" name="info" placeholder="Additional information"/>
            <br>
            <label for="info">Additional information:</label>
            <br>
            <form>
          <textarea name="info" id="info" rows="5" cols="33" placeholder="Additional information">
            </textarea>
            </form>
        </form >
       </legend>
       <form id="survey-form">
        <input type="submit" id="submit"/>
        </form>
        </form>
  </body>
</html>
